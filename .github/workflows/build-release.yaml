name: Package FunTube from upstream release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag (for example v2.0.1), or latest"
        required: true
        default: latest
        type: string
      publish_release:
        description: "Publish a release after verification (leave off for a preview)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 15 * * *'

# Only the release-publishing step gets this repository's token in its environment.
# No personal tokens or signing certificates are required.
permissions:
  contents: write

concurrency:
  group: funtube-release
  cancel-in-progress: false

jobs:
  package:
    # Scheduled publishing stays off until the first preview/release is verified.
    if: github.repository == 'giyorah/FunTube' && (github.event_name == 'workflow_dispatch' || vars.FUNTUBE_AUTO_RELEASE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out FunTube customization
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect release, customize and verify package
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag || 'latest' }}
          SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--icon standalone/icon.png --tag "$UPSTREAM_TAG" --output-dir out)
          if [[ "$SHOULD_PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          python build_funtube.py "${args[@]}"

      - name: Save preview and verification files
        if: success() && hashFiles('out/*.wgt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: FunTube-package-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: error
